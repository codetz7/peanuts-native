name: Demon Slayer Peanuts Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh ninja-build cmake clang \
            build-essential curl unzip zip git

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android SDK and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build native packer
        run: |
          export MSBuildEnableWorkloadResolver=false
          zsh peanuts/scripts/ondevice-stage.sh "$RUNNER_TEMP/ondevice"

      - name: Build Demon Slayer APK
        working-directory: android/app
        run: |
          ./gradlew apk \
            -PnxApp=peanuts \
            -PnxAppId=peanutstest \
            -PnxLabel="Peanuts Test Demon Slayer" \
            -PnxGames=0100309016E7A000 \
            -PnxPackEngine=native \
            -PnxPackStage="$RUNNER_TEMP/ondevice/stage" \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Peanuts-Test-Demon-Slayer
          path: android/app/out/nxnative-android-peanuts.apk
          if-no-files-found: error
